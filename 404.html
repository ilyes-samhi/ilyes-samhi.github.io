<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>404 – Ilyes Samhi</title>
<meta name="theme-color" content="#ECEEEA">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  var tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.content = t === 'dark' ? '#14171A' : '#ECEEEA';
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<!-- Chemins absolus (commençant par /) : cette page peut être servie depuis n'importe quelle adresse -->
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<style>
  main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem 1.5rem; }
  .code { font: 600 clamp(3.5rem, 14vw, 7rem)/1 var(--head); letter-spacing: -.035em; margin: 0 0 1rem; }
  p { margin: 0 0 .4rem; color: var(--muted); }
  a { font: 500 .95rem var(--head); display: inline-block; margin-top: 1.25rem; }
</style>
</head>
<body>
<main>
  <h1 class="code">404</h1>
  <p>This page doesn't exist.</p>
  <p lang="fr">Cette page n'existe pas.</p>
  <a href="/">← Ilyes Samhi</a>
</main>
</body>
</html>
